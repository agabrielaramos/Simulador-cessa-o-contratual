import sys
from datetime import datetime

def calcular_acerto_contas(salario_base, data_inicio, data_baixa, data_fim, ferias_gozadas_vencidas=0, pago_em_duodecimos=False):
    """
    Calcula as contas de fecho de contrato considerando suspensão por baixa prolongada.
    Formato das datas: 'AAAA-MM-DD'
    """
    try:
        d_inicio = datetime.strptime(data_inicio, "%Y-%m-%d")
        d_baixa = datetime.strptime(data_baixa, "%Y-%m-%d")
        d_fim = datetime.strptime(data_fim, "%Y-%m-%d")
    except ValueError:
        print("Erro: Formato de data inválido. Use o formato 'AAAA-MM-DD'.")
        return

    # 1. Dias efetivos trabalhados no ano da cessação antes do início da baixa
    inicio_ano_cessacao = datetime(d_fim.year, 1, 1)
    dias_efetivos_ano = (d_baixa - inicio_ano_cessacao).days
    if dias_efetivos_ano < 0:
        dias_efetivos_ano = 0

    valor_diario = salario_base / 365

    # 2. Direitos Vencidos a 1 de Janeiro (Trabalho do ano anterior)
    ferias_vencidas_dias = max(0, 22 - ferias_gozadas_vencidas)
    valor_ferias_vencidas = (salario_base / 22) * ferias_vencidas_dias
    
    if pago_em_duodecimos:
        valor_sub_ferias_vencido = 0
    else:
        valor_sub_ferias_vencido = salario_base if ferias_gozadas_vencidas == 0 else ((salario_base / 22) * ferias_vencidas_dias)

    # 3. Proporcionais do Ano de Cessação (Apenas dias de trabalho efetivo)
    valor_sub_natal_prop = valor_diario * dias_efetivos_ano
    valor_sub_ferias_prop = valor_diario * dias_efetivos_ano
    dias_ferias_prop = (22 / 365) * dias_efetivos_ano
    valor_ferias_prop = valor_diario * dias_efetivos_ano

    # 4. Cálculo de Totais
    total_empresa = valor_ferias_vencidas + valor_sub_ferias_vencido + valor_sub_natal_prop + valor_sub_ferias_prop + valor_ferias_prop
    
    # Dias de Baixa / Suspensão (Contados desde o início da baixa até ao fim do contrato)
    dias_baixa = (d_fim - d_baixa).days + 1
    if dias_baixa < 0:
        dias_baixa = 0

    # Apresentação dos Resultados
    print("=" * 65)
    print(f"📊 SIMULADOR DE ACERTO DE CONTAS (Com Baixa Prolongada)")
    print("=" * 65)
    print(f"🗓️  Dias de trabalho efetivo em {d_fim.year} (pré-baixa): {dias_efetivos_ano} dias")
    print(f"🤒  Dias de afastamento por baixa médica: {dias_baixa} dias (Suspensão)")
    print("-" * 65)
    print(f"💰 DIREITOS VENCIDOS (A 01/01/{d_fim.year}):")
    print(f"   - Férias Vencidas Não Gozadas ({ferias_vencidas_dias} dias): {valor_ferias_vencidas:.2f} €")
    print(f"   - Subsídio de Férias Vencido: {valor_sub_ferias_vencido:.2f} €")
    print("-" * 65)
    print(f"📈 PROPORCIONAIS DO ANO DE CESSAÇÃO ({d_fim.year}):")
    print(f"   - Proporcional Subsídio de Natal: {valor_sub_natal_prop:.2f} €")
    print(f"   - Proporcional Subsídio de Férias: {valor_sub_ferias_prop:.2f} €")
    print(f"   - Proporcional Férias Não Gozadas ({dias_ferias_prop:.2f} dias): {valor_ferias_prop:.2f} €")
    print("=" * 65)
    print(f"💵 TOTAL BRUTO A PAGAR PELA EMPRESA: {total_empresa:.2f} €")
    print("=" * 65)
    print(f"🛡️  A REQUERER À SEGURANÇA SOCIAL (Prestações Compensatórias):")
    print(f"   - Deverá pedir as prestações compensatórias relativas a {dias_baixa} dias")
    print(f"     de subsídio de Natal e férias não suportados pela empresa.")
    print("=" * 65)

if __name__ == "__main__":
    # Execução padrão com os dados fornecidos pelo utilizador
    calcular_acerto_contas(
        salario_base=950.00,
        data_inicio="2019-12-02",
        data_baixa="2026-03-09",
        data_fim="2026-09-26",
        ferias_gozadas_vencidas=0,
        pago_em_duodecimos=False
    )
